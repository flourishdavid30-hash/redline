<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#06070d">
<meta name="mobile-web-app-capable" content="yes">
<title>Redline</title>
<style>
html,body{height:100%;margin:0;background:#06070d;overflow:hidden;color:#fff;
font-family:system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#pad{position:fixed;left:0;right:0;bottom:0;height:112px;display:flex;align-items:center;
justify-content:space-between;padding:0 12px 10px;pointer-events:none}
.g{display:flex;gap:12px;pointer-events:auto}
.b{width:62px;height:62px;border-radius:50%;background:rgba(16,20,28,.85);
border:1px solid rgba(255,150,110,.35);display:flex;align-items:center;justify-content:center;
font-size:11px;font-weight:700;color:#ffd9c9}
.b:active{background:rgba(220,90,60,.55);transform:scale(.94)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="pad">
<div class="g"><div class="b" id="L">&#9668;</div><div class="b" id="R">&#9658;</div></div>
<div class="g"><div class="b" id="B">BRAKE</div><div class="b" id="G">GAS</div></div>
</div>
<script>
var cv=document.getElementById("c"),ctx=cv.getContext("2d"),W=800,H=450,S=1,T=0;
function fit(){var p=innerWidth<760?112:0;S=Math.min(innerWidth/W,(innerHeight-p)/H);
cv.width=Math.round(W*S);cv.height=Math.round(H*S);cv.style.width=cv.width+"px";cv.style.height=cv.height+"px"}
addEventListener("resize",fit);fit();

/* ---------- track ---------- */
var L=200,RW=2000,CH=1000,DEP=1/Math.tan(50*Math.PI/180),DRAW=300,CAM=DRAW*L;
var MAX=24000,ACC=MAX/4.5,BRK=-MAX/1.4,DEC=-MAX/6,OFF=-MAX/1.6;
var segs=[],TL=0;
function top(){return segs.length?segs[segs.length-1].y2:0}
function add(c,y){var n=segs.length;segs.push({id:n,c:c,y1:top(),y2:y,z1:n*L,z2:(n+1)*L,
o:[],d:(n/3|0)%2,s1:{},s2:{}});TL=segs.length*L}
function sgn(n){n=Math.round(n);return n-Math.floor(n/segs.length)*segs.length}
function ez(a,b,p){return a+(b-a)*(-Math.cos(p*Math.PI)/2+.5)}
function sec(en,ho,le,c,h){var s=top(),e=s+h*L,n=en+ho+le,i;
for(i=0;i<en;i++)add(ez(0,c,i/en),ez(s,e,i/n));
for(i=0;i<ho;i++)add(c,ez(s,e,(en+i)/n));
for(i=0;i<le;i++)add(ez(c,0,i/le),ez(s,e,(en+ho+i)/n))}
function st(n){sec(n,n,n,0,0)}
st(40);sec(50,50,50,2.6,20);st(25);sec(45,45,45,-3.2,-14);st(25);
sec(60,60,60,3.8,30);sec(40,40,40,-1.8,-16);st(30);sec(55,55,55,-4.2,0);st(40);
sec(50,50,50,2.2,40);st(20);sec(55,55,55,-3,-40);st(35);sec(45,45,45,4.6,10);
st(25);sec(50,50,50,-2.6,-12);st(45);sec(48,48,48,3.2,26);st(30);
for(var i=6;i<segs.length;i+=6){var sd=(i/6)%2?-1:1;
segs[i].o.push({p:sd*(1.3+Math.random()*1.3),t:(i%12<6)?1:2});
if(Math.random()<.1)segs[i].o.push({p:sd*2.5,t:3})}
var cars=[],COL=["#c94f3d","#3f7fbf","#e0b23a","#5fbf8a","#b7b7c2","#8a5fbf"];
for(var j=0;j<45;j++)cars.push({z:Math.random()*TL,p:Math.random()*1.6-.8,
rel:0,sp:MAX*(.12+Math.random()*.42),c:COL[j%6]});

/* ---------- state ---------- */
var P={pos:0,pl:0,sp:0},k={l:0,r:0,g:0,b:0};
var G={st:"count",t:1.9,time:70,laps:0,sc:0,best:0,shake:0,flash:0};
try{G.best=parseFloat(localStorage.getItem("redline-best")||"0")||0}catch(e){}

/* ---------- audio ---------- */
var AC=null,eng=null,engG=null;
function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}
if(AC){eng=AC.createOscillator();eng.type="sawtooth";engG=AC.createGain();engG.gain.value=0;
var lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=800;
eng.connect(lp);lp.connect(engG);engG.connect(AC.destination);eng.start()}}
function beep(f,q,v){if(!AC)return;var n=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
o.type="square";o.frequency.value=f;g.gain.setValueAtTime(v,n);
g.gain.exponentialRampToValueAtTime(.001,n+q);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+q)}
function bang(){if(!AC)return;var n=(AC.sampleRate*.2)|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);
for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);var s=AC.createBufferSource();s.buffer=b;
var g=AC.createGain();g.gain.value=.25;s.connect(g);g.connect(AC.destination);s.start()}

/* ---------- math ---------- */
function pr(wx,wy,wz,cx,cy,cz,o){o.cx=wx-cx;o.cy=wy-cy;o.cz=wz-cz;var s=DEP/o.cz;
o.sx=Math.round(W/2+s*o.cx*W/2);o.sy=Math.round(H/2-s*o.cy*H/2);
o.sw=Math.round(s*RW*W/2);o.sc=s}
function quad(x1,y1,x2,y2,x3,y3,x4,y4,c){ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x1,y1);
ctx.lineTo(x2,y2);ctx.lineTo(x3,y3);ctx.lineTo(x4,y4);ctx.closePath();ctx.fill()}
var SX=[],SY=[],SS=[],CL=[];

/* ---------- update ---------- */
function upd(dt){T+=dt;G.shake*=Math.pow(.02,dt);G.flash=Math.max(0,G.flash-dt);
if(G.st==="count"){G.t-=dt;if(G.t<=0){G.st="run";beep(950,.3,.2)}return}
if(G.st==="over"){if(k.g){k.g=0;again()}return}
P.pos=P.pos%TL;
var n=P.pos/L|0,base=segs[sgn(n)].id,sp=P.sp/MAX,sg=segs[sgn(n)];
P.pl+=((k.r?1:0)-(k.l?1:0))*dt*4.5*Math.max(.15,sp);
P.pl-=sp*sp*sg.c*dt*1.4;
P.pl=Math.max(-2,Math.min(2,P.pl));
if(Math.abs(P.pl)>1){P.sp+=OFF*dt;G.shake=Math.max(G.shake,7)}
if(k.g)P.sp+=ACC*dt;else if(k.b)P.sp+=BRK*dt;else P.sp+=DEC*dt;
P.sp=Math.max(0,Math.min(MAX,P.sp));
P.pos+=P.sp*dt;
for(var c=0;c<cars.length;c++){var r=cars[c];
r.z+=r.sp*dt;if(r.z>=TL)r.z-=TL;
r.p+=Math.sin(T*.6+r.z*.0013)*dt*.4;r.p=Math.max(-.9,Math.min(.9,r.p));
r.rel=r.z-P.pos;if(r.rel<0)r.rel+=TL;if(r.rel>TL-L)r.rel-=TL;
if(r.rel>-L*.3&&r.rel<L*.6&&Math.abs(r.p-P.pl)<.5&&G.flash<=0){
P.sp=Math.min(P.sp,r.sp*.7);P.pl+=(P.pl<r.p?-1:1)*.3;
G.shake=17;G.flash=.3;bang();if(navigator.vibrate)navigator.vibrate(90)}}
if(Math.abs(P.pl)>1&&sp>.2){var s2=segs[sgn(n)];
for(var o=0;o<s2.o.length;o++)if(Math.abs(s2.o[o].p-P.pl)<.4){
P.sp*=.22;G.shake=19;G.flash=.3;bang();s2.o[o].p=s2.o[o].p<0?-9:9}}
var lap=Math.floor(P.pos/TL)+Math.floor((P.pos%TL)/TL);
if(P.pos+P.sp*dt>=TL)lapNow();
G.sc+=P.sp*dt*.02;G.time-=dt;
if(G.time<=0){G.time=0;G.st="over";beep(150,.7,.2);
if(G.sc>G.best){G.best=G.sc;try{localStorage.setItem("redline-best",String(G.best))}catch(e){}}}
if(AC&&eng){eng.frequency.value=48+(P.sp/MAX)*190+Math.random()*5;
engG.gain.value=G.st==="run"?.03+(P.sp/MAX)*.05:0}}
function lapNow(){G.laps++;G.time+=25;beep(1200,.2,.2)}

/* ---------- draw ---------- */
function sky(){var g=ctx.createLinearGradient(0,0,0,H);
g.addColorStop(0,"#101a35");g.addColorStop(.4,"#5b3f6b");g.addColorStop(.6,"#c85f46");
g.addColorStop(.73,"#f0a24d");g.addColorStop(1,"#161e2c");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
var sx=W*.62,sy=H*.5,rg=ctx.createRadialGradient(sx,sy,4,sx,sy,120);
rg.addColorStop(0,"rgba(255,225,150,.95)");rg.addColorStop(1,"rgba(255,140,60,0)");
ctx.fillStyle=rg;ctx.beginPath();ctx.arc(sx,sy,120,0,6.2832);ctx.fill();
ctx.fillStyle="#ffe6a8";ctx.beginPath();ctx.arc(sx,sy,34,0,6.2832);ctx.fill();
var b=H*.56;ctx.fillStyle="rgba(28,20,44,.9)";ctx.beginPath();ctx.moveTo(0,b+40);
for(var x=0;x<=W;x+=26)ctx.lineTo(x,b-24+Math.sin((x+P.pl*40)*.006)*34+Math.sin(x*.017+2)*16);
ctx.lineTo(W,b+40);ctx.fill();
ctx.fillStyle="rgba(20,14,32,.95)";ctx.beginPath();ctx.moveTo(0,b+40);
for(var y=0;y<=W;y+=22)ctx.lineTo(y,b+6+Math.sin((y+P.pos*.002+P.pl*80)*.011)*18);
ctx.lineTo(W,b+40);ctx.fill()}
function tree(x,y,h,cl){if(y<cl)return;ctx.fillStyle="#1d2b1c";ctx.beginPath();ctx.moveTo(x,y-h);
ctx.lineTo(x+h*.4,y-h*.35);ctx.lineTo(x-h*.4,y-h*.35);ctx.closePath();ctx.fill();
ctx.fillStyle="#16351f";ctx.beginPath();ctx.moveTo(x,y-h*.85);ctx.lineTo(x+h*.5,y-h*.15);
ctx.lineTo(x-h*.5,y-h*.15);ctx.closePath();ctx.fill()}
function palm(x,y,sc,cl){var h=300*sc;if(y<cl)return;ctx.fillStyle="#2a1d14";
ctx.fillRect(x-2*sc,y-h,4*sc,h);ctx.fillStyle="#12351f";
for(var i=0;i<6;i++){var a=-Math.PI/2+(i-2.5)*.5;ctx.beginPath();ctx.moveTo(x,y-h);
ctx.quadraticCurveTo(x+Math.cos(a)*60*sc,y-h+Math.sin(a)*h*.3,x+Math.cos(a)*95*sc,y-h+Math.sin(a)*h*.5+8*sc);
ctx.lineTo(x+Math.cos(a)*60*sc,y-h+Math.sin(a)*h*.6);ctx.closePath();ctx.fill()}}
function sign(x,y,sc,cl){var h=120*sc;if(y<cl)return;ctx.fillStyle="#3a3f46";
ctx.fillRect(x-sc,y-h,2*sc,h);ctx.fillStyle="#d94f3d";ctx.fillRect(x-26*sc,y-h,52*sc,28*sc);
if(sc>1.6){ctx.fillStyle="#fff";ctx.font="bold "+Math.round(11*sc)+"px system-ui";
ctx.textAlign="center";ctx.fillText("REDLINE",x,y-h+19*sc)}}
function car(x,y,sc,cl,col){if(y<cl)return;var w=200*sc,h=80*sc;
ctx.fillStyle="rgba(0,0,0,.45)";ctx.beginPath();ctx.ellipse(x,y+2*sc,w*.55,h*.1,0,0,6.2832);ctx.fill();
ctx.fillStyle="#0b0d12";ctx.fillRect(x-w*.46,y-h*.38,w*.15,h*.34);ctx.fillRect(x+w*.31,y-h*.38,w*.15,h*.34);
ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-w*.5,y-h*.16);ctx.lineTo(x-w*.44,y-h*.6);
ctx.lineTo(x-w*.2,y-h*.66);ctx.lineTo(x+w*.2,y-h*.66);ctx.lineTo(x+w*.44,y-h*.6);
ctx.lineTo(x+w*.5,y-h*.16);ctx.closePath();ctx.fill();
ctx.fillStyle="#0e1218";ctx.beginPath();ctx.moveTo(x-w*.25,y-h*.64);ctx.lineTo(x+w*.25,y-h*.64);
ctx.lineTo(x+w*.17,y-h*.96);ctx.lineTo(x-w*.17,y-h*.96);ctx.closePath();ctx.fill();
ctx.fillStyle="#ff3b2f";ctx.fillRect(x-w*.45,y-h*.5,w*.11,h*.08);ctx.fillRect(x+w*.34,y-h*.5,w*.11,h*.08)}
function road(){var n=P.pos/L|0,x=0,dx=0,i,maxy=H,sg0=segs[sgn(n)];
var baseY=CH+(sg0.y1+(sg0.y2-sg0.y1)*((P.pos%L)/L));
for(i=0;i<DRAW;i++){var s=segs[sgn(n+i)],cz=P.pos-(s.id<segs[sgn(n)].id?TL:0);
pr(0,s.y1,s.z1,P.pl*RW-x,baseY,cz,s.s1);
pr(0,s.y2,s.z2,P.pl*RW-x-dx,baseY,cz,s.s2);
x+=dx;dx+=s.c;SX[i]=s.s1.sx;SY[i]=s.s1.sy;SS[i]=s.s1.sc;CL[i]=maxy;
if(s.s1.cz<=CAM||s.s2.sy>=maxy||s.s2.sy>=s.s1.sy)continue;
var g=s.d?"#354000":"#2c3400",r=s.d?"#474c56":"#41464f",ru=s.d?"#e8e8ee":"#7a2b26";
quad(0,s.s1.sy,W,s.s1.sy,W,s.s2.sy,0,s.s2.sy,g);
var a=s.s1,x2=s.s2;
quad(a.sx-a.sw-a.sw*.14,a.sy,a.sx-a.sw,a.sy,x2.sx-x2.sw,x2.sy,x2.sx-x2.sw-x2.sw*.14,x2.sy,ru);
quad(a.sx+a.sw+a.sw*.14,a.sy,a.sx+a.sw,a.sy,x2.sx+x2.sw,x2.sy,x2.sx+x2.sw+x2.sw*.14,x2.sy,ru);
quad(a.sx-a.sw,a.sy,a.sx+a.sw,a.sy,x2.sx+x2.sw,x2.sy,x2.sx-x2.sw,x2.sy,r);
if(s.d){var lw=a.sw*.02;quad(a.sx-lw,a.sy,a.sx+lw,a.sy,x2.sx+lw,x2.sy,x2.sx-lw,x2.sy,"#c9ccd2");
quad(a.sx-a.sw*.5-lw,a.sy,a.sx-a.sw*.5+lw,a.sy,x2.sx-x2.sw*.5+lw,x2.sy,x2.sx-x2.sw*.5-lw,x2.sy,"#c9ccd2");
quad(a.sx+a.sw*.5-lw,a.sy,a.sx+a.sw*.5+lw,a.sy,x2.sx+x2.sw*.5+lw,x2.sy,x2.sx+x2.sw*.5-lw,x2.sy,"#c9ccd2")}
maxy=s.s2.sy}
var bk={};for(var c=0;c<cars.length;c++){var q=cars[c];
if(q.rel>0&&q.rel<CAM){var ii=q.rel/L|0;(bk[ii]=bk[ii]||[]).push(q)}}
for(i=DRAW-1;i>1;i--){var sg2=segs[sgn(n+i)];
for(var o=0;o<sg2.o.length;o++){var ob=sg2.o[o],ox=sg2.s1.sx+sg2.s1.sc*ob.p*RW*W/2,sc=sg2.s1.sc*W;
if(ob.t===1)palm(ox,sg2.s1.sy,sc*1.5,CL[i]);else if(ob.t===2)tree(ox,sg2.s1.sy,180*sc,CL[i]);else sign(ox,sg2.s1.sy,sc*1.5,CL[i])}
var lst=bk[i];if(lst)for(var m=0;m<lst.length;m++){var cr=lst[m],cs=sg2.s1.sc*W*.9;
car(sg2.s1.sx+sg2.s1.sc*cr.p*RW*W/2,sg2.s1.sy,cs,CL[i],cr.c)}}}
function mine(){var sp=P.sp/MAX,bn=(1.25-Math.random())*sp*4+(Math.abs(P.pl)>1?Math.sin(T*60)*4:0);
ctx.save();ctx.translate(W*.5+P.pl*24,H-58+bn);
ctx.rotate(((k.r?1:0)-(k.l?1:0))*.03+segs[sgn(P.pos/L|0)].c*sp*.012);
ctx.fillStyle="rgba(0,0,0,.5)";ctx.beginPath();ctx.ellipse(0,10,132,16,0,0,6.2832);ctx.fill();
if(sp>.06){ctx.fillStyle="rgba(255,120,60,"+(sp*.22)+")";ctx.beginPath();ctx.moveTo(-118,4);
ctx.lineTo(-190-sp*90,-4);ctx.lineTo(-190-sp*90,8);ctx.lineTo(-118,10);ctx.closePath();ctx.fill()}
ctx.fillStyle="#14161d";ctx.fillRect(-118,-24,34,34);ctx.fillRect(84,-24,34,34);
ctx.fillStyle="#e8e9ee";ctx.beginPath();ctx.moveTo(-108,6);ctx.lineTo(-96,-22);ctx.lineTo(96,-22);
ctx.lineTo(108,6);ctx.closePath();ctx.fill();
ctx.fillStyle="#d24a38";ctx.beginPath();ctx.moveTo(-96,-22);ctx.lineTo(-58,-56);ctx.lineTo(58,-56);
ctx.lineTo(96,-22);ctx.closePath();ctx.fill();
ctx.fillStyle="#0d1016";ctx.beginPath();ctx.moveTo(-50,-52);ctx.lineTo(50,-52);ctx.lineTo(38,-30);
ctx.lineTo(-38,-30);ctx.closePath();ctx.fill();
ctx.fillStyle="#0b0d12";ctx.fillRect(-104,-30,208,7);
ctx.fillStyle="#ffb04a";ctx.fillRect(-92,-16,26,7);ctx.fillRect(66,-16,26,7);
ctx.fillStyle="#ff2d1a";ctx.fillRect(-96,-6,30,6);ctx.fillRect(66,-6,30,6);ctx.restore()}
function hud(){ctx.textAlign="left";ctx.fillStyle="rgba(255,255,255,.55)";ctx.font="600 11px system-ui";
ctx.fillText("SPEED",34,H-96);ctx.fillStyle="#fff";ctx.font="700 42px system-ui";
ctx.fillText(Math.round(P.sp/MAX*320),34,H-56);ctx.fillStyle="rgba(255,255,255,.45)";
ctx.font="600 11px system-ui";ctx.fillText("KM/H",132,H-56);
ctx.textAlign="right";ctx.fillStyle="rgba(255,255,255,.55)";ctx.fillText("TIME",W-34,H-96);
ctx.fillStyle=(G.time<11&&Math.sin(T*10)>0)?"#ff4b39":"#fff";ctx.font="700 42px system-ui";
ctx.fillText(Math.ceil(G.time),W-34,H-56);
ctx.textAlign="center";ctx.font="600 11px system-ui";ctx.fillStyle="rgba(255,255,255,.5)";
ctx.fillText("SCORE "+Math.floor(G.sc)+"    BEST "+Math.floor(G.best)+"    LAP "+(G.laps+1),W/2,H-72);
if(G.flash>0){ctx.fillStyle="rgba(255,60,40,"+(G.flash*.5)+")";ctx.fillRect(0,0,W,H)}
if(G.st==="count"){ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="900 92px system-ui";
var v=Math.ceil(G.t-.9);ctx.fillText(v>0?v:"GO!",W/2,H/2)}
if(G.st==="over"){ctx.fillStyle="rgba(4,6,10,.8)";ctx.fillRect(0,0,W,H);
ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="900 46px system-ui";ctx.fillText("TIME UP",W/2,H/2-40);
ctx.font="600 18px system-ui";ctx.fillStyle="rgba(255,255,255,.8)";
ctx.fillText("Score "+Math.floor(G.sc)+"   Laps "+(G.laps+1)+"   Best "+Math.floor(G.best),W/2,H/2);
ctx.font="600 14px system-ui";ctx.fillStyle="#ffd9c9";ctx.fillText("tap GAS to race again",W/2,H/2+34)}}
function again(){P.pos=0;P.pl=0;P.sp=0;G.st="count";G.t=1.9;G.time=70;G.laps=0;G.sc=0}

/* ---------- loop ---------- */
var last=0;
function loop(ts){var dt=Math.min(.045,(ts-last)/1000)||.016;last=ts;
upd(dt);ctx.setTransform(S,0,0,S,0,0);ctx.save();
if(G.shake>.4)ctx.translate((Math.random()-.5)*G.shake,(Math.random()-.5)*G.shake);
sky();road();mine();ctx.restore();hud();requestAnimationFrame(loop)}
requestAnimationFrame(function(t){last=t;loop(t)});

/* ---------- controls ---------- */
function bind(id,on,off){var e=documentfunction bind(id,on,off){var e=document.getElementById(id);
 e.addEventListener("pointerdown",function(ev){ev.preventDefault();audio();on()},{passive:false});
 e.addEventListener("pointerup",function(ev){ev.preventDefault();off&&off()},{passive:false});
 e.addEventListener("pointercancel",function(){off&&off()});
 e.addEventListener("pointerleave",function(){off&&off()})}
bind("L",function(){k.l=1},function(){k.l=0});
bind("R",function(){k.r=1},function(){k.r=0});
bind("G",function(){k.g=1},function(){k.g=0});
bind("B",function(){k.b=1},function(){k.b=0});
addEventListener("keydown",function(e){if(e.key==="ArrowLeft")k.l=1;if(e.key==="ArrowRight")k.r=1;
 if(e.key==="ArrowUp")k.g=1;if(e.key==="ArrowDown")k.b=1});
addEventListener("keyup",function(e){if(e.key==="ArrowLeft")k.l=0;if(e.key==="ArrowRight")k.r=0;
 if(e.key==="ArrowUp")k.g=0;if(e.key==="ArrowDown")k.b=0});
</script>
</body>
</html>
