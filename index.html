<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Redline</title>
<style>
html,body{height:100%;margin:0;background:#06070d;overflow:hidden;color:#fff;font-family:system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block}
#e{display:none;position:fixed;left:6px;right:6px;top:6px;background:#711;color:#fff;font:11px monospace;padding:6px;z-index:9}
#pad{position:fixed;left:0;right:0;bottom:0;height:108px;display:flex;align-items:center;justify-content:space-between;padding:0 12px 8px;pointer-events:none}
.g{display:flex;gap:12px;pointer-events:auto}
.b{width:60px;height:60px;border-radius:50%;background:rgba(16,20,28,.85);border:1px solid rgba(255,150,110,.35);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#ffd9c9}
.b:active{background:rgba(220,90,60,.6)}
</style></head><body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="e"></div>
<div id="pad">
<div class="g"><div class="b" id="L">&#9668;</div><div class="b" id="R">&#9658;</div></div>
<div class="g"><div class="b" id="B">BRAKE</div><div class="b" id="G">GAS</div></div>
</div>
<script>
var er=document.getElementById("e");
window.onerror=function(m){er.style.display="block";er.textContent="CODE ERROR: "+m};
var cv=document.getElementById("c"),g=cv.getContext("2d"),W=800,H=450,S=1;
function fit(){var p=innerWidth<760?108:0;S=Math.min(innerWidth/W,(innerHeight-p)/H);
cv.width=Math.round(W*S);cv.height=Math.round(H*S);cv.style.width=cv.width+"px";cv.style.height=cv.height+"px"}
addEventListener("resize",fit);fit();
var L=200,RW=2000,CH=1000,D=1/Math.tan(50*Math.PI/180),DRAW=160,CAM=DRAW*L,MAX=24000,TL=0,sg=[],i;
function add(c,y){sg.push({c:c,y1:sg.length?sg[sg.length-1].y2:0,y2:y,o:[],d:0})}
function sec(en,ho,le,cu,hg){var s=sg.length?sg[sg.length-1].y2:0,e=s+hg*L,n=en+ho+le,j,c;
for(j=0;j<n;j++){c=j<en?cu*(.5-Math.cos(j/en*Math.PI)/2):j<en+ho?cu:cu*(.5+Math.cos((j-en-ho)/le*Math.PI)/2);
add(c,s+(e-s)*(.5-Math.cos(j/n*Math.PI)/2))}}
function st(n){sec(n,n,n,0,0)}
st(25);sec(40,40,40,2.6,20);st(20);sec(40,40,40,-3.2,-14);st(20);sec(45,45,45,3.6,26);
sec(30,30,30,-1.8,-14);st(25);sec(40,40,40,-4,0);st(25);sec(45,45,45,2.2,34);
sec(45,45,45,-2.8,-34);st(25);sec(40,40,40,4.4,10);st(20);sec(45,45,45,-2.6,-10);
st(30);sec(45,45,45,3,22);st(25);
TL=sg.length*L;
for(i=0;i<sg.length;i++)sg[i].d=((i/4)|0)%2;
for(i=8;i<sg.length;i+=5)sg[i].o.push({p:(i%10<5?-1:1)*(1.3+Math.random()*1.1),t:(i%10<5)?1:2});
var COL=["#c94f3d","#3f7fbf","#e0b23a","#5fbf8a","#c9c9d6","#8a5fbf"],car=[];
/* END PART 1 */
  for(i=0;i<30;i++)car.push({z:Math.random()*TL,x:Math.random()*1.6-.8,v:MAX*(.28+Math.random()*.32),c:(Math.random()*COL.length)|0});
var P={z:0,x:0,v:0,lap:1,t:0,best:0,spin:0},k={l:0,r:0,g:0,b:0},last=0;
function sgAt(z){return sg[((z/L)|0)%sg.length]}
function cl(v,a,b){return v<a?a:v>b?b:v}
function update(dt){
 var b=((P.z/L)|0),oz=P.z,s=sgAt(P.z),sp=P.v/MAX;
 if(P.spin>0){P.spin-=dt;P.x-=(sp>.5?3:sp*5)*dt;P.v*=Math.pow(.2,dt)}
 else{
  if(k.g)P.v+=8200*dt;else if(k.b)P.v-=15000*dt;else P.v-=2600*dt;
  P.v=cl(P.v,0,MAX);
  P.x+=((k.r?1:0)-(k.l?1:0))*dt*(1.3+sp*1.8);
  P.x-=dt*sp*s.c*.0026;
 }
 if(Math.abs(P.x)>1.02&&P.v>1500)P.v-=12000*dt;
 P.x=cl(P.x,-2.3,2.3);
 var nz=P.z+P.v*dt;
 if(nz>=TL){nz-=TL;P.lap++;if(!P.best||P.t<P.best)P.best=P.t;P.t=0}
 P.z=nz;P.t+=dt;
 for(var n=((oz/L)|0)%sg.length,m=((P.z/L)|0)%sg.length,q=0;q<12&&n!==m;q++){
  var cs=sg[n];
  if(P.spin<=0)for(var e=0;e<cs.o.length;e++){var o=cs.o[e];
   if(Math.abs(o.p-P.x)<.3){P.spin=1;P.v*=.3;break}}
  n=(n+1)%sg.length;
 }
 for(var j=0;j<car.length;j++){var c=car[j];c.z=(c.z+c.v*dt)%TL;
  c.x+=Math.sin((c.z+c.p0||c.z)/3000)*.0006;
  var dz=c.z-P.z;if(dz<0)dz+=TL;
  if(dz<L*1.3&&dz>-L*.5&&Math.abs(c.x-P.x)<.33&&P.spin<=0){
   P.v=c.v*.55;P.spin=.75;c.z=(c.z+L*4)%TL;c.x=cl(c.x+(c.x>P.x?.7:-.7),-.85,.85);
  }}
}
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);
 g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.fill()}
function draw(dt){
 g.setTransform(S,0,0,S,0,0);
 var sky=g.createLinearGradient(0,0,0,H*.5);sky.addColorStop(0,"#1a2450");
 sky.addColorStop(.6,"#4b3a63");sky.addColorStop(1,"#d8703f");
 g.fillStyle=sky;g.fillRect(0,0,W,H*.52);
 g.fillStyle="#ffd27a";g.beginPath();g.arc(W*.72,H*.42,34,0,7);g.fill();
 g.fillStyle="#241a33";g.beginPath();g.moveTo(0,H*.52);
 for(var m=0;m<=8;m++)g.lineTo(m*W/8,H*.52-Math.abs(Math.sin(m*1.7))*46);
 g.lineTo(W,H*.52);g.fill();
 var N=sg.length,b=((P.z/L)|0),pct=(P.z%L)/L,bs=sg[b%N],
  camY=bs.y1+(bs.y2-bs.y1)*pct+CH,camZ=P.z-CAM;
 g.fillStyle="#111c14";g.fillRect(0,H*.5,W,H*.5);
 var x=0,dx=-(bs.c*pct),pts=[];
 for(var n=0;n<=DRAW;n++){var idx=(b+n)%N,s0=sg[idx],cz=(b+n+1)*L-camZ,sc=D/cz;
  pts.push({x:W/2+sc*(x-P.x*RW)*W/2,y:H/2-sc*(s0.y2-camY)*H/2,w:sc*RW*W/2,s:sc,i:idx,d:n});
  x+=dx;dx+=s0.c;
 }
 for(n=DRAW;n>0;n--){var a=pts[n],p=pts[n-1];if(!a||!p)continue;
  var lt=a.i%2,dg=Math.min(1,a.d/DRAW);
  g.fillStyle=lt?"#1d2b1c":"#162216";g.fillRect(0,p.y,W,a.y-p.y+1);
  g.fillStyle=lt?"#3a3e4a":"#343843";
  g.beginPath();g.moveTo(p.x-p.w,p.y);g.lineTo(p.x+p.w,p.y);g.lineTo(a.x+a.w,a.y);g.lineTo(a.x-a.w,a.y);g.fill();
  var r1=p.w*.12,r2=a.w*.12;
  g.fillStyle=lt?"#c0392b":"#ecf0f1";
  g.beginPath();g.moveTo(p.x-p.w-r1,p.y);g.lineTo(p.x-p.w,p.y);g.lineTo(a.x-a.w,a.y);g.lineTo(a.x-a.w-r2,a.y);g.fill();
  g.beginPath();g.moveTo(p.x+p.w+r1,p.y);g.lineTo(p.x+p.w,p.y);g.lineTo(a.x+a.w,a.y);g.lineTo(a.x+a.w+r2,a.y);g.fill();
  if(lt){var lw1=p.w*.02,lw2=a.w*.02,lanes=3;
   for(var q=1;q<lanes;q++){var f1=-1+2*q/lanes,f2=f1;
    g.fillStyle="rgba(240,240,235,.75)";
    g.beginPath();g.moveTo(p.x+p.w*f1-lw1,p.y);g.lineTo(p.x+p.w*f1+lw1,p.y);
    g.lineTo(a.x+a.w*f2+lw2,a.y);g.lineTo(a.x+a.w*f2-lw2,a.y);g.fill()}}
  for(var e2=0;e2<sg[a.i].o.length;e2++){var o=sg[a.i].o[e2],ox=a.x+a.s*o.p*RW*W/2,u=a.s*RW*W/2;
   if(o.t===1){g.fillStyle="#0f3d1e";g.beginPath();g.moveTo(ox,a.y-u*.95);g.lineTo(ox-u*.17,a.y);g.lineTo(ox+u*.17,a.y);g.fill();
    g.fillStyle="#4b3018";g.fillRect(ox-u*.025,a.y,u*.05,u*.14)}
   else{g.fillStyle="#e8ecf3";g.fillRect(ox-u*.035,a.y-u*.62,u*.07,u*.62)}}
  for(var j=0;j<car.length;j++){var c=car[j];if(((c.z/L)|0)%N!==a.i)continue;
   var cx=a.x+a.s*c.x*RW*W/2,u2=a.s*RW*W/2,cw=u2*.3,chh=cw*.66;
   g.fillStyle="rgba(0,0,0,.4)";g.beginPath();g.ellipse(cx,a.y,cw*.55,chh*.14,0,0,7);g.fill();
   g.fillStyle=COL[c.c];rr(cx-cw/2,a.y-chh,cw,chh*.86,Math.max(1,cw*.12));
   g.fillStyle="rgba(18,24,36,.92)";rr(cx-cw*.3,a.y-chh*.94,cw*.6,chh*.34,Math.max(1,cw*.08));
   g.fillStyle="#ffdf9a";g.fillRect(cx-cw*.42,a.y-chh*.34,cw*.15,chh*.12);g.fillRect(cx+cw*.27,a.y-chh*.34,cw*.15,chh*.12);
  }
  if(dg>.45){g.fillStyle="rgba(24,22,44,"+(dg-.45)*1.5+")";g.fillRect(0,p.y,W,a.y-p.y+1)}
 }
 var u3=.55,px=W/2+Math.sin(P.z/300)*0,py=H*.79;
 var tilt=((k.r?1:0)-(k.l?1:0))*.06+P.spin*.5;
 g.save();g.translate(px,py);g.rotate(tilt);
 g.fillStyle="rgba(0,0,0,.45)";g.beginPath();g.ellipse(0,26,60,11,0,0,7);g.fill();
 g.fillStyle="#111";g.fillRect(-58,10,16,18);g.fillRect(42,10,16,18);
 g.fillStyle="#c0392b";rr(-46,-34,92,62,14);
 g.fillStyle="rgba(20,26,38,.92)";rr(-30,-26,60,26,9);
 g.fillStyle="#ffe9b0";g.fillRect(-42,18,18,7);g.fillRect(24,18,18,7);
 g.restore();
 var sp=Math.round(P.v/MAX*260);
 g.fillStyle="rgba(6,8,14,.55)";rr(14,12,190,72,10);
 g.fillStyle="#ffd9c9";g.font="bold 30px system-ui";g.fillText(sp,26,48);
 g.font="11px system-ui";g.fillStyle="#9aa3b5";g.fillText("KM/H",26,64);
 g.fillText("LAP "+P.lap,110,36);
 g.fillText("TIME "+P.t.toFixed(1)+"s",110,54);
 g.fillText("BEST "+(P.best?P.best.toFixed(2)+"s":"-"),110,72);
 if(P.v<40&&P.spin<=0){g.fillStyle="rgba(255,220,200,.9)";g.font="bold 16px system-ui";
  g.textAlign="center";g.fillText("HOLD  GAS  TO DRIVE",W/2,H*.62);g.textAlign="left"}
}
function loop(t){var dt=Math.min(.05,(t-last)/1000||.016);last=t;update(dt);draw(dt);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
function bind(id,on,off){var el=document.getElementById(id);if(!el)return;
 var u=function(e){e.preventDefault();off&&off()};
 el.addEventListener("pointerdown",function(e){e.preventDefault();on()},{passive:false});
 el.addEventListener("pointerup",u,{passive:false});
 el.addEventListener("pointercancel",u,{passive:false});
 el.addEventListener("pointerleave",u,{passive:false})}
bind("L",function(){k.l=1},function(){k.l=0});
bind("R",function(){k.r=1},function(){k.r=0});
bind("G",function(){k.g=1},function(){k.g=0});
bind("B",function(){k.b=1},function(){k.b=0});
addEventListener("keydown",function(e){if(e.key==="ArrowUp")k.g=1;if(e.key==="ArrowDown")k.b=1;
 if(e.key==="ArrowLeft")k.l=1;if(e.key==="ArrowRight")k.r=1});
addEventListener("keyup",function(e){if(e.key==="ArrowUp")k.g=0;if(e.key==="ArrowDown")k.b=0;
 if(e.key==="ArrowLeft")k.l=0;if(e.key==="ArrowRight")k.r=0});
</script>
</body></html>
